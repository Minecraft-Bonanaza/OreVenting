name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd datapack && zip -r ../OreVenting-datapack-${GITHUB_REF_NAME}.zip custom_vents/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OreVenting-datapack-*.zip
